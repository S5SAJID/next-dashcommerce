# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Comprehensive configuration to enforce best practices, check security, and provide detailed feedback.

language: "en-US"

reviews:
  # Set the profile to 'assertive' to ensure the AI is direct and firm in pointing out issues.
  profile: "assertive"

  # Provides a high-level summary of the changes and the overall health of the code.
  high_level_summary: true

  # Auto-review is enabled for all commits on push, running all configured tools.
  auto_review:
    enabled: true
    # Review is triggered even for work-in-progress or draft commits/PRs
    drafts: true 
    ignore_title_keywords: [] # Review everything

  # Enable various tools to enforce best practices and security:
  tools:
    # General JavaScript/TypeScript/React linting and best practices
    eslint:
      enabled: true

    # CRITICAL: Secret detection to find common security issues (e.g., hardcoded API keys)
    gitleaks:
      enabled: true

    # # Dockerfile best practices and security checks
    # hadolint:
    #   enabled: true

    # # Optional: Enable static analysis for Go code if used
    # # golangci-lint:
    # #   enabled: false

chat:
  # Automatically generate conversational replies to feedback or common questions
  auto_reply: true

knowledge_base:
  # Instruct the AI to cross-reference code changes against internal guidelines
  code_guidelines:
    enabled: true
    # Specify files containing your team's specific coding rules and standards
    filePatterns:
      - "**/CODE_GUIDELINES.md"
